<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:;">
<title>mapper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="topbar">
  <div class="group" id="tools"></div>
  <div class="group">
    <select id="unit-sel" title="显示单位"></select>
  </div>
  <div class="spacer"></div>
  <span id="map-name" class="muted"></span>
  <div class="group">
    <button id="btn-save" title="立即保存当前地图配置">保存</button>
    <button id="btn-calib-clear" title="清除已标定的比例尺" class="hidden">清除标定</button>
    <button id="btn-settings" title="设置">设置</button>
  </div>
</div>
<div id="main">
  <aside id="map-panel">
    <div class="panel-head">
      <span>地图</span>
      <div class="group">
        <button class="btn-mini" id="btn-add-dir" title="添加地图目录">+目录</button>
        <button class="btn-mini" id="btn-rescan" title="重新扫描">↻</button>
      </div>
    </div>
    <div id="dir-list"></div>
  </aside>
  <div id="canvas-wrap">
    <canvas id="cv"></canvas>
    <div id="measure" class="hidden"></div>
    <div id="scalebar" class="hidden">
      <div class="bar"></div>
      <div class="txt"></div>
    </div>
  </div>
  <aside id="layer-panel">
    <div class="panel-head">
      <span>图层</span>
      <button class="btn-mini" id="btn-new-layer" title="新建图层">+</button>
    </div>
    <div id="layer-list"></div>
    <div class="panel-foot">
      <button id="btn-layer-up" title="上移">↑</button>
      <button id="btn-layer-down" title="下移">↓</button>
      <button id="btn-layer-del" title="删除当前图层">删除</button>
      <button id="btn-layer-rename" title="重命名当前图层">改名</button>
    </div>
  </aside>
</div>
<div id="statusbar">
  <span id="st-zoom"></span>
  <span id="st-pos"></span>
  <span id="st-ratio"></span>
  <span id="st-hint"></span>
</div>
<div id="toast" class="hidden"></div>
<div id="modal-mask" class="hidden">
  <div id="modal"></div>
</div>
<script src="units.js"></script>
<script src="layers.js"></script>
<script src="store.js"></script>
<script src="view.js"></script>
<script src="tools.js"></script>
<script src="app.js"></script>
</body>
</html>
