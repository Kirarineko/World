<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>皓月夜明 Lunalit 标志</title>
  <defs>
    <!-- 月之暗面：并非纯黑，而是深夜的蓝 -->
    <radialGradient id="night" cx="38%" cy="45%" r="70%">
      <stop offset="0" stop-color="#26355F"/>
      <stop offset="0.65" stop-color="#151E3D"/>
      <stop offset="1" stop-color="#0B1128"/>
    </radialGradient>
    <!-- 月光笔触：起笔重、收笔轻 -->
    <linearGradient id="moon" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#E9CF8E"/>
      <stop offset="0.55" stop-color="#F7EBCB"/>
      <stop offset="1" stop-color="#FFFBEF"/>
    </linearGradient>
    <linearGradient id="echo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EBCB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F7EBCB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F7EBCB" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF6DC" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFF6DC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 整轮月：暗面 -->
  <circle cx="100" cy="100" r="72" fill="url(#night)"/>

  <!-- 暗面中的星点：所见的黑暗，只是未曾理解的光明 -->
  <g stroke="#AFC0E8" stroke-opacity="0.35" stroke-width="0.7" fill="none">
    <polyline points="78,60 62,78 88,96 104,126"/>
    <line x1="88" y1="96" x2="54" y2="112"/>
  </g>
  <g fill="#D5DEF5">
    <circle cx="88" cy="96" r="6" fill="url(#glow)" opacity="0.6"/>
    <circle cx="88" cy="96" r="2.1"/>
    <circle cx="62" cy="78" r="1.5" opacity="0.9"/>
    <circle cx="78" cy="60" r="1.1" opacity="0.8"/>
    <circle cx="54" cy="112" r="1.2" opacity="0.8"/>
    <circle cx="104" cy="126" r="1.3" opacity="0.85"/>
    <circle cx="110" cy="72" r="0.9" opacity="0.6"/>
    <circle cx="44" cy="92" r="0.8" opacity="0.5"/>
    <circle cx="70" cy="134" r="1.0" opacity="0.6"/>
    <circle cx="96" cy="148" r="0.8" opacity="0.5"/>
  </g>

  <!-- 对影：月光的一道回声，二重奏的另一声部 -->
  <path d="M102.5 43.6 A60 60 0 0 1 102.5 156.4" fill="none"
        stroke="url(#echo)" stroke-width="1.3" stroke-linecap="round"/>

  <!-- 新月：一笔画成的月光 -->
  <path d="M75.4 32.3 A72 72 0 1 1 75.4 167.7 A68 68 0 1 0 75.4 32.3 Z" fill="url(#moon)"/>
  <!-- 笔触中的飞白 -->
  <path d="M150.6 57.6 A66 66 0 0 1 142.4 150.6" fill="none"
        stroke="#C9A867" stroke-opacity="0.45" stroke-width="0.8" stroke-linecap="round"/>
</svg>
